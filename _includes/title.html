<!-- Inject style overrides to clear theme limits and adjust sizing -->
<style>
  .site-header, 
  .site-title,
  div[class*="site-nav"], 
  div[class*="side-bar"] .site-header {
    height: auto !important;
    min-height: max-content !important;
    max-height: none !important;
    overflow: visible !important;
  }
</style>

<a href="{{ '/' | relative_url }}" class="site-title" style="display: flex !important; align-items: center !important; gap: 10px !important; height: auto !important; min-height: fit-content !important; padding: 12px 0 !important; white-space: normal !important; overflow: visible !important;">
  {% if site.logo %}
    <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} Logo" style="height: 32px !important; width: auto !important; flex-shrink: 0 !important; display: block !important;">
  {% endif %}
  <!-- Changed font-size to a smaller, scalable value and updated word wrapping -->
  <span style="font-size: 1.0rem !important; line-height: 1.3 !important; display: block !important; word-break: normal !important; overflow-wrap: break-word !important; white-space: normal !important;">{{ site.title }}</span>
</a>
