<a href="{{ '/' | relative_url }}" class="site-title" style="display: flex; align-items: center; gap: 12px; height: auto; padding: 10px 0; white-space: normal;">
  {% if site.logo %}
    <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} Logo" style="height: 32px; width: auto; flex-shrink: 0; display: block;">
  {% endif %}
  <span style="line-height: 1.2; word-break: break-word;">{{ site.title }}</span>
</a>
