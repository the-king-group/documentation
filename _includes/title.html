<!-- Inject a small style block to clear the theme's height limits -->
<style>
  .site-header, 
  .site-title,
  div[class*="site-nav"], 
  div[class*="side-bar"] .site-header {
    height: auto !important;
    min-height: max-content !important;
    max-height: none !important;
    overflow: visible !important;
  }
</style>

<a href="{{ '/' | relative_url }}" class="site-title" style="display: flex !important; align-items: center !important; gap: 12px !important; height: auto !important; min-height: fit-content !important; padding: 12px 0 !important; white-space: normal !important; overflow: visible !important;">
  {% if site.logo %}
    <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} Logo" style="height: 36px !important; width: auto !important; flex-shrink: 0 !important; display: block !important;">
  {% endif %}
  <span style="line-height: 1.3 !important; display: block !important; word-break: break-word !important; white-space: normal !important;">{{ site.title }}</span>
</a>
